<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>TikTok 手机经营总看板</title>
  <style>
    :root { color:#17202a; background:#f3f6f8; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { display:grid; min-height:100vh; margin:0; place-items:center; padding:24px; }
    main { width:min(100%,430px); padding:32px; border:1px solid #e3e8ef; border-radius:18px; background:#fff; box-shadow:0 18px 50px rgba(23,32,42,.1); }
    .eyebrow { margin:0 0 12px; color:#65748a; font-size:12px; font-weight:760; letter-spacing:.09em; text-transform:uppercase; }
    h1 { margin:0; font-size:28px; letter-spacing:-.05em; line-height:1.14; }
    p { color:#627084; font-size:14px; line-height:1.6; }
    label { display:grid; gap:7px; margin-top:24px; color:#334155; font-size:13px; font-weight:700; }
    input { min-height:46px; padding:0 12px; border:1px solid #ccd5df; border-radius:10px; color:#17202a; font:inherit; }
    input:focus { border-color:#246bce; outline:3px solid rgba(36,107,206,.15); }
    button { width:100%; min-height:46px; margin-top:14px; border:0; border-radius:10px; background:#12202d; color:#fff; font:inherit; font-size:14px; font-weight:750; cursor:pointer; }
    button:disabled { cursor:wait; opacity:.7; }
    #message { min-height:22px; margin:12px 0 0; color:#b42318; font-size:13px; }
    .note { margin-top:22px; color:#78869a; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">realme Indonesia · Private viewer</p>
    <h1>TikTok 手机经营总看板</h1>
    <p>请输入管理员提供的访问密码。密码不会被上传或保存在本网站中。</p>
    <form id="unlock-form">
      <label>访问密码
        <input id="passphrase" type="password" autocomplete="current-password" required minlength="16" autofocus>
      </label>
      <button id="unlock" type="submit">打开看板</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="note">本页面只保存已加密的数据包；未经密码无法读取销售数据。</p>
  </main>
  <script>
    const form = document.getElementById("unlock-form");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("unlock");
    const message = document.getElementById("message");

    const fromBase64 = (value) => Uint8Array.from(atob(value), character => character.charCodeAt(0));

    async function decrypt(passphrase, payload) {
      const keyMaterial = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(passphrase), { name: "PBKDF2" }, false, ["deriveBits"],
      );
      const bits = await crypto.subtle.deriveBits({
        name: "PBKDF2", salt: fromBase64(payload.salt), iterations: payload.iterations, hash: "SHA-256",
      }, keyMaterial, 256);
      const key = await crypto.subtle.importKey("raw", bits, { name: "AES-GCM" }, false, ["decrypt"]);
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: fromBase64(payload.iv) }, key, fromBase64(payload.ciphertext));
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "正在解锁数据…";
      try {
        const response = await fetch("./dashboard.enc.json", { cache: "no-store" });
        if (!response.ok) throw new Error("看板数据尚未发布。");
        const payload = await response.json();
        const html = new TextDecoder().decode(await decrypt(input.value, payload));
        if (!html.startsWith("<!doctype html>")) throw new Error("访问密码不正确。");
        input.value = "";
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        message.textContent = error.message === "看板数据尚未发布。" ? error.message : "访问密码不正确，请重试。";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
