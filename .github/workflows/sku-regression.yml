name: SKU regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sku-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check sku-core.js
      - run: node --check inventory-turnover.js
      - run: node tests/sku-regression.js
