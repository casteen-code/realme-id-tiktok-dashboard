name: Campaign motion checks

on:
  push:
    branches: [main]
    paths:
      - 'campaign-motion-studio/**'
      - '.github/workflows/campaign-motion-check.yml'
  pull_request:
    paths:
      - 'campaign-motion-studio/**'
      - '.github/workflows/campaign-motion-check.yml'

permissions:
  contents: read

jobs:
  campaign-motion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campaign-motion-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: campaign-motion-studio/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- index.html
