name: Publish operating dashboard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - dashboard.enc.json
      - sites-build.mjs
      - tests/site-build-regression.mjs
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check publishing contract with synthetic fixtures
        run: |
          node --check sites-build.mjs
          node tests/site-build-regression.mjs
      - name: Build approved operating-dashboard website files
        run: node sites-build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
