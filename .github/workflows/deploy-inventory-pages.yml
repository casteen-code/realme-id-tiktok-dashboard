name: Publish inventory turnover page

on:
  push:
    branches: [main]
    paths:
      - inventory-turnover.html
      - inventory-turnover.js
      - sku-core.js
      - vendor/xlsx.full.min.js
      - index.html
      - dashboard.enc.json
      - sites-build.mjs
      - .github/workflows/deploy-inventory-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: inventory-turnover-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check turnover rules
        run: |
          node --check inventory-turnover.js
          node tests/sku-regression.js
      - name: Build website files
        run: node sites-build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
